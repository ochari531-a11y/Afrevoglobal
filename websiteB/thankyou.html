<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - Vapourize Collective</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      font-family: "Consolas","Courier New", monospace;
      color: #00ff00;
      background: black;
    }
    canvas#matrix {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 30px;
      background: rgba(0,0,0,0.7);
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(0,255,0,0.5), 0 0 35px rgba(255,23,68,0.5);
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #00ff00; text-shadow:0 0 15px #00ff00,0 0 20px #ff1744; }
    p { margin: 0.5rem 0; font-size:1rem; color:#aaffaa; }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #00ff00;
      color: black;
      transition: background 0.3s, box-shadow 0.3s;
      box-shadow:0 0 15px rgba(0,255,0,0.6),0 0 15px rgba(255,23,68,0.4);
    }
    button:hover {
      background: #88ff88;
      box-shadow:0 0 25px rgba(0,255,0,0.9),0 0 25px rgba(255,23,68,0.6);
    }
  </style>
</head>
<body>

  <canvas id="matrix" aria-hidden="true"></canvas>

  <div class="container">
    <h1>✔ Submission Received</h1>
    <p>Thank you for your request. A secure receipt has been generated below.</p>
    <div style="margin-top:20px;">
      <button id="downloadBtn">Download Receipt</button>
      <button id="printBtn">Print Receipt</button>
      <button onclick="window.location.href='index.html'">Submit Another</button>
    </div>
  </div>

  <script>
    // Matrix background
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    let fontSize = 16;
    let columns;
    let drops = [];
    const letters = "アカサタナハマヤラワ0123456789$#%&ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function initMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let i=0;i<drops.length;i++){
        const text = letters.charAt(Math.floor(Math.random()*letters.length));
        ctx.fillStyle = Math.random()>0.5 ? "#00ff00" : "#ff1744";
        ctx.font = fontSize + "px monospace";
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);
        if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
      }
    }

    window.addEventListener("resize", initMatrix);
    initMatrix();
    setInterval(drawMatrix,33);

    // Receipt content
    function getReceiptContent() {
      let data = {};
      try {
        data = JSON.parse(sessionStorage.getItem("vcSubmission")) || {};
      } catch(e) {}
      return `
Vapourize Collective - Secure Submission Receipt

Alias: ${data.alias||""}
Email: ${data.email||""}
Phone: ${data.phone||""}
Reason: ${data.reason||""}
Timeline: ${data.timeline||""}
Notes: ${data.additional||""}

Created: ${data.created_at || new Date().toLocaleString()}
Saved to Remote: ${data.saved_remote ? "Yes":"No"}
      `;
    }

    // Download PDF
    document.getElementById("downloadBtn").addEventListener("click",()=>{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("courier","normal");
      doc.setFontSize(12);
      doc.text(getReceiptContent(), 10, 10);
      doc.save("VC_Receipt.pdf");
    });

    // Print
    document.getElementById("printBtn").addEventListener("click",()=>{
      const win = window.open("","PrintReceipt","width=600,height=800");
      win.document.write("<pre>"+getReceiptContent()+"</pre>");
      win.document.close();
      win.print();
    });
  </script>

</body>
</html>
